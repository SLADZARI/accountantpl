name: AccountantPL — checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Static validation
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Confirm Vercel output
        run: test -f dist/index.html
