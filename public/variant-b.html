/* P1 fixes — readable compact financial chart and route-aware printing. */
@container (max-width:540px){
  .fc-chart-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(135px,auto);
    grid-template-rows:auto auto;
    grid-template-areas:'period amounts' 'bars bars';
    gap:9px 10px;
    align-items:start;
    padding:7px 0;
    border-bottom:1px solid var(--border);
  }
  .fc-chart-row:last-child{border-bottom:0}
  .fc-chart-month{grid-area:period;font-size:13px;line-height:1.45;align-self:center;color:var(--text-primary);font-weight:600}
  .fc-bar-stack{grid-area:bars;min-width:0;min-height:28px}
  .fc-bar-pair{gap:5px}
  .fc-chart-value{grid-area:amounts;font:500 13px/1.6 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.015em;text-align:right;white-space:nowrap}
  .fc-chart-value span{font-size:13px;line-height:1.6}
  .fc-bars{gap:10px}
}
@container (max-width:350px){
  .fc-chart-row{grid-template-columns:minmax(0,1fr) minmax(125px,auto);gap:8px}
  .fc-chart-month,.fc-chart-value,.fc-chart-value span{font-size:13px}
}
@media print{
  @page{size:auto;margin:12mm}
  html,body{width:auto!important;background:#fff!important;color:#111820!important}
  body .demo-toolbar,body .side,body .shelltop,body .mobile-dock,body .side-scrim,body #overlayRoot,body #toastRoot{display:none!important}
  body .canvas,body .device,body .screen,body .workbench,body .workspace{display:block!important;width:auto!important;max-width:none!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#fff!important}
  body #homeApp,body #moduleApp,body #app{display:none!important}
  body[data-print-route="home"] #homeApp{display:block!important}
  body[data-print-route="vat"] #app{display:block!important}
  body[data-print-route]:not([data-print-route="home"]):not([data-print-route="vat"]) #moduleApp{display:block!important}
  body .fc-content,body #app{padding:0!important;max-width:none!important;margin:0!important;background:#fff!important}
  body .fc-card,body .fc-stat{box-shadow:none!important;break-inside:avoid}
  body .fc-mobile-docs,body #app .mobile-list{display:none!important}
  body #moduleApp .fc-table-wrap,body #app .table-clip{display:block!important;overflow:visible!important}
  body .fc-table-controls,body .fc-bulk,body .fc-btn,body .fc-quiet-link,body .fc-text-button,body .fc-icon-button,body #app .controls,body #app .filter-panel,body #app .notice{display:none!important}
  body .fc-chart-row{break-inside:avoid}
  body .fc-chart-value,body .fc-chart-value span{font-size:11px!important}
}


/* ==============================================================
   Onsaldo / Financial Clarity V4 — hierarchy and mobile reflow
   The preceding VAT and detail functionality remains intact.
   ============================================================== */
:root{--primary:#285BFA;--text-primary:#111820;--background:#F6F8FC;--border:#D8DFEA;--body:Inter,Arial,sans-serif;--display:'Space Grotesk',Inter,sans-serif;--mono:'IBM Plex Mono',monospace}
html,body{background:var(--background);color:var(--text-primary)}
body{font-family:var(--body);font-size:14px}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #285BFA88!important;outline-offset:3px!important}
.canvas{padding:22px 20px 45px;background:var(--background)}
.device{max-width:1500px}
.screen{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 45px #2039610a}
.workbench{grid-template-columns:232px minmax(0,1fr)}
.side{background:#FAFBFE;border-right:1px solid var(--border);padding:28px 12px}
.side-logo{color:#111820;padding:0 12px;font:700 23px/1 var(--display);letter-spacing:-.05em}
.side-mark{background:var(--primary);border-radius:9px;width:34px;height:34px}
.side-link{min-height:42px;border-radius:8px;color:#4D5B70;font-weight:600;font-size:13px;text-align:left}
.side-link.active,.side-link:hover{background:#EAF0FF;color:#214BE4}
.side-link.active{border-color:transparent}
.side-link svg{width:18px;height:18px}
.side-kicker{color:#7D899D;font-size:10px;letter-spacing:.07em}
.side-footer{display:none}
.shelltop{height:70px;padding:0 32px;background:#fff;border-bottom:1px solid var(--border)}
.shell-location{gap:10px;font-size:13px;color:#68788E}
.shell-location span:first-of-type{font-weight:700;color:#1A2738}
.shell-location span:nth-of-type(2){color:#C1CADE}
.shell-location strong{font-weight:600;color:#506075}
.shell-actions{gap:14px}
.top-action{position:relative;width:40px;height:40px;color:#47566F;border:1px solid #DCE3ED;border-radius:9px}
.top-action svg{width:19px;height:19px}
.nav-alert-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;background:#BF7840;border:2px solid white;box-sizing:content-box;border-radius:50%}
.avatar{background:#E8EFFF;color:#285BFA;border-color:#D6E1FF;font-size:12px;width:37px;height:37px}
.shell-account{font-size:13px}
.shell-account strong{font-size:12px;color:#26364A}
.shell-account small{font-size:11px;color:#778497}
.shell-menu{border-color:var(--border);box-shadow:0 18px 48px #1a315422}
.shell-menu button{background:#EAF0FF;color:#2454E8}
.fc-content{max-width:1380px;padding:32px 36px 52px;margin:0 auto}
.fc-heading{margin-bottom:16px}
.fc-heading h1,.clarity-page-head h1{font:600 32px/1.14 var(--display);letter-spacing:-.045em;color:var(--text-primary)}
.fc-heading p{color:#647287;font-size:14px}
.fc-eyebrow{display:none}
.fc-notice.fc-context{display:flex;align-items:center;gap:9px;min-height:36px;background:transparent!important;border:0!important;border-radius:0;padding:0!important;margin:0 0 20px;color:#7E899C;font-size:12px;box-shadow:none!important;line-height:1.4}
.fc-context svg{display:none}
.fc-context-dot{width:7px;height:7px;border-radius:50%;background:#B2BED1;flex:none}
.fc-notice.fc-context button{font-size:12px;color:#4662A4;background:none;border:0;margin-left:auto;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.fc-context strong{font-weight:500}
/* A low-visibility testing aid: outside the product surface. */
.qa-controls{max-width:1500px;margin:0 auto;position:relative;padding:0 22px;color:#647185}
.qa-controls>summary{font-size:11px;font-weight:600;cursor:pointer;display:list-item;list-style-position:inside;margin:0 0 5px;opacity:.7;text-align:right}
.qa-controls:not([open])>summary{padding:2px}
.qa-controls .demo-toolbar{justify-content:flex-end;margin:0 0 9px;border:1px solid #DDE4EF;background:#fff;color:#536277;border-radius:10px;box-shadow:none;padding:10px 14px;gap:10px}
.qa-controls .demo-brand{color:#6A788F}
.qa-controls .demo-dot{background:#8FA5CC;box-shadow:0 0 0 3px #E4ECFB}
.qa-controls .demo-tools .tool-label{color:#6B7A8D}
.qa-controls .segmented{background:#F2F5FA;border:1px solid #D8E0EB}
.qa-controls .segmented button{color:#58677C}
.qa-controls .segmented button.active{color:#fff;background:#285BFA}
/* 01: attention, then measures, then evidence */
.clarity-home{max-width:1340px}
.clarity-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:8px}
.clarity-overline{font:600 11px/1.3 var(--body);color:#59718C;letter-spacing:.09em;margin:0 0 10px}
.clarity-page-head h1{margin:0}
.clarity-page-head p:last-child{font-size:14px;color:#66758A;margin:9px 0 0}
.clarity-period{display:inline-flex;align-items:center;gap:9px;font-size:13px;white-space:nowrap;color:#354967;font-weight:600;border:1px solid var(--border);border-radius:9px;padding:12px 13px;background:#fff}
.clarity-period svg{width:17px;height:17px;color:#285BFA}

.clarity-attention-symbol{width:40px;height:40px;background:#F5E9CE;border-radius:10px;color:#8A5B10;display:grid;place-items:center;align-self:start}
.clarity-attention-symbol svg{width:20px;height:20px}

.clarity-attention-action{border:0;border-radius:8px;background:#285BFA;color:#fff;min-height:44px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:700;white-space:nowrap}
.clarity-attention-action:hover{background:#1949D7}
.clarity-attention-action svg{width:15px;height:15px}
.clarity-section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:17px}
.clarity-section-num{font-size:10px;font-weight:700;letter-spacing:.11em;color:#8391A6}

.clarity-kpi-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.clarity-kpi-feature,.clarity-kpi-card{display:flex;flex-direction:column;min-width:0;min-height:198px;border-radius:12px;padding:22px;overflow:hidden}
.clarity-kpi-feature{background:#285BFA;color:#fff;position:relative}
.clarity-kpi-feature:before{content:'';position:absolute;right:-68px;top:-126px;width:260px;height:260px;border:1px solid #ffffff3b;border-radius:50%;box-shadow:0 0 0 25px #ffffff06,0 0 0 54px #ffffff06;pointer-events:none}
.clarity-kpi-card{background:#fff;border:1px solid var(--border)}
.clarity-kpi-top,.clarity-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:650}

.clarity-feature-value,.clarity-card-value{text-align:right;display:block;width:100%;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-family:var(--display);font-weight:600;line-height:1.12;margin:24px 0 18px}

a-label="Poprzednia strona" ${state.page===1?'disabled':''}>${ic('left')}</button><span>${state.page} / ${count}</span><button data-action="next" aria-label="Następna strona" ${state.page===count?'disabled':''}>${ic('right')}</button></div><select class="page-size" id="pageSize" aria-label="Liczba pozycji na stronie"><option value="10" ${state.pageSize===10?'selected':''}>10 na stronie</option><option value="20" ${state.pageSize===20?'selected':''}>20 na stronie</option><option value="50" ${state.pageSize===50?'selected':''}>50 na stronie</option></select></div></div>`}

// P1: shared accessible modal management for VAT and transaction confirmation.
const OnsaldoDialog = (()=>{
  const root = () => document.getElementById('overlayRoot');
  const focusableSelector = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  let dialog=null, previousFocus=null, previousScroll=null, returnSelector='', onClose=null, inertNodes=[];
  function focusable(){return dialog ? [...dialog.querySelectorAll(focusableSelector)].filter(el=>!el.hidden&&!el.closest('[hidden]')&&el.getAttribute('aria-hidden')!=='true') : []}
  function focusInside(selector){
    if(!dialog)return;
    const preferred=selector?dialog.querySelector(selector):null;
    const target=(preferred&&!preferred.disabled?preferred:null)||focusable()[0]||dialog;
    if(!dialog.hasAttribute('tabindex'))dialog.setAttribute('tabindex','-1');
    target.focus({preventScroll:true});
  }
  function activate({onDismiss,returnTo,focusTo}={}){
    const next=root().querySelector('[role="dialog"][aria-modal="true"]');
    if(!next)return;
    if(!dialog){
      previousFocus=document.activeElement;
      previousScroll=document.body.style.overflow;
      document.body.style.overflow='hidden';
      inertNodes=[...document.querySelectorAll('body > .demo-toolbar, body > .qa-controls, body > .canvas')].map(el=>({el,wasInert:el.inert}));
      inertNodes.forEach(({el})=>{el.inert=true});
    }
    dialog=next;
    onClose=onDismiss||onClose;
    if(returnTo)returnSelector=returnTo;
    focusInside(focusTo);
  }
  function close({after}={}){
    if(!dialog){root().innerHTML='';return}
    const origin=previousFocus,selector=returnSelector;
    root().innerHTML='';dialog=null;onClose=null;previousFocus=null;returnSelector='';
    document.body.style.overflow=previousScroll||'';previousScroll=null;
    inertNodes.forEach(({el,wasInert})=>{el.inert=wasInert});inertNodes=[];
    if(typeof after==='function')after();
    const fallback=selector?document.querySelector(selector):null;
    const target=origin&&origin.isConnected&&origin!==document.body&&origin!==document.documentElement&&!origin.closest('[hidden]')?origin:fallback;
    if(target&&typeof target.focus==='function'&&!target.disabled)target.focus({preventScroll:true});
    else document.querySelector('.workspace h1, #app h1, .shell-location strong')?.focus({preventScroll:true});
  }
  function keydown(e){
    if(!dialog)return;
    if(e.key==='Escape'){
      e.preventDefault();e.stopImmediatePropagation();
      if(onClose)onClose();else close();
      return;
    }
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){
      e.preventDefault();e.stopImmediatePropagation();return;
    }
    if(e.key!=='Tab')return;
    const list=focusable();
    if(!list.length){e.preventDefault();dialog.focus();return}
    const first=list[0],last=list[list.length-1],active=document.activeElement;
    if(e.shiftKey&&(active===first||!dialog.contains(active))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(active===last||!dialog.contains(active))){e.preventDefault();first.focus()}
  }
  document.addEventListener('keydown',keydown,true);
  document.addEventListener('focusin',e=>{
    if(dialog&&!dialog.contains(e.target)&&e.target!==dialog)focusInside();
  },true);
  return {activate,close,isOpen:()=>!!dialog};
})();
window.OnsaldoDialog=OnsaldoDialog;

function showModal(kind,focusTo){state.modal=kind;const root=document.getElementById('overlayRoot');let content='';if(kind==='settings'){content=`<p>Wybierz widoczne kolumny i zmień ich kolejność. Wszystkie pola dokumentu pozostają dostępne w szczegółach.</p><div class="modal-list" id="columnList">${state.columns.map((c,i)=>`<div class="column-row"><label><input type="checkbox" data-column="${c}" ${state.visible.includes(c)?'checked':''}>${colNames[c]}</label><div class="order-actions"><button data-order="up" data-column="${c}" ${i===0?'disabled':''} aria-label="Przesuń ${colNames[c]} w górę">↑</button><button data-order="down" data-column="${c}" ${i===state.columns.length-1?'disabled':''} aria-label="Przesuń ${colNames[c]} w dół">↓</button></div></div>`).join('')}</div><div class="modal-actions"><button class="reset-link" data-action="restore-columns">Przywróć domyślne</button><button class="primary-btn" data-action="modal-close">Gotowe</button></div>`}

let names={settings:'Dostosuj kolumny',tags:'Etykiety dokumentów'};root.innerHTML=`<div class="overlay" role="presentation" data-action="overlay-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${names[kind]}"><div class="modal-header"><h3>${names[kind]}</h3><button class="icon-btn filter-close" data-action="modal-close" aria-label="Zamknij">${ic('close')}</button></div>${content}</section></div>`;

else return;
render();});

 const n=new Date(y,m,0).getDate();
 const grid=days.map(d=>`<span class="fc-weekday">${d}</span>`).join('')+Array.from({length:start},()=>'<span aria-hidden="true"></span>').join('')+Array.from({length:n},(_,i)=>`<button type="button" class="calendar-day ${selectedDay===i+1?'chosen':''}" data-calendar-day="${i+1}" aria-pressed="${selectedDay===i+1}" aria-label="${i+1} ${monthName()}">${i+1}</button>`).join('');
 return `<div class="fc-calendar" aria-label="Kalendarz rozliczeń"><div class="fc-calendar-heading"><h3>${monthName()}</h3><div class="fc-calendar-controls"><button type="button" data-period="prev" aria-label="Poprzedni miesiąc">${icon('chevron')}</button><button type="button" data-period="next" aria-label="Następny miesiąc">${icon('chevron')}</button></div></div><div class="fc-calendar-grid">${grid}</div><p>${selectedDay?`${selectedDay} ${monthName()} · Brak wpisanych terminów.`:'Wybierz dzień, aby sprawdzić zaplanowane terminy.'}</p></div>`;
}
function taxBreakdown(){let a=monthRows().filter(r=>r.type==='sale'),b=monthRows().filter(r=>r.type==='purchase');return [total(a,'vat'),total(b,'vat')]}
function renderTaxes(){let [vatOut,vatIn]=taxBreakdown();let diff=Number((vatOut-vatIn).toFixed(2)),isError=scenario()==='error';let period=monthName();let all=monthRows();
 $('moduleApp').innerHTML=`<div class="fc-content">${head('','Podatki i terminy','',periodBadge())}${info()}${isError?errorPanel('Nie można ustalić kwot podatków'):scenario()==='empty'?emptyPanel('Brak podstaw do wyliczeń','Brak dokumentów do wyliczenia kwoty VAT w wybranym okresie.'):`<div class="fc-stats taxes-stats"><article class="fc-stat"><div class="fc-stat-label">VAT do rozliczenia · szacunek</div><div class="fc-stat-value">${mon(diff)}</div><p class="fc-stat-note">${period} · ${all.length} dokumentów</p></article><article class="fc-stat"><div class="fc-stat-label">Kwota potwierdzona</div><div class="fc-stat-value">—</div><p class="fc-stat-note">Brak zatwierdzonego rozliczenia</p></article><article class="fc-stat"><div class="fc-stat-label">Zapłacono</div><div class="fc-stat-value">—</div><p class="fc-stat-note">Brak potwierdzenia płatności</p></article></div>`}
 <div class="fc-columns tax-layout"><section class="fc-card"><div class="fc-card-head"><div><h2>Obowiązki</h2><p>Terminy zależą od sposobu rozliczenia firmy</p></div>${status('Wymaga weryfikacji','warn')}</div><div class="fc-obligations"><article><div class="fc-ob-icon">${icon('calendar')}</div><div><strong>VAT / JPK V7</strong><p>Okres: ${period}</p><small>Termin: do potwierdzenia dla organizacji</small></div><button type="button" data-fc="tax-detail" aria-expanded="${detailTax==='vat'}">Szczegóły ${icon('down')}</button></article>${detailTax==='vat'?`<div class="fc-tax-detail"><div class="fc-tax-line"><span>VAT należny · sprzedaż</span><strong>${mon(vatOut)}</strong></div><div class="fc-tax-line"><span>VAT naliczony · zakupy</span><strong>− ${mon(vatIn)}</strong></div><div class="fc-tax-line total"><span>Różnica VAT</span><strong>${mon(vatOut-vatIn)}</strong></div><p>Źródło: ${all.length} dokumentów, stawka 23%. Bez walidacji prawa do odliczenia ani danych o wcześniejszych okresach.</p><button class="fc-quiet-link" data-route="vat">Pokaż dokumenty VAT ${icon('chevron')}</button></div>`:''}
 <article><div class="fc-ob-icon">${icon('calendar')}</div><div><strong>Podatek dochodowy</strong><p>Wysokość zależy od formy opodatkowania</p><small>Termin i kwota: nieustalone</small></div>${status('Brak podstaw','neutral')}</article><article><div class="fc-ob-icon">${icon('calendar')}</div><div><strong>Składki ZUS</strong><p>Kwoty zależą od sytuacji przedsiębiorcy</p><small>Wymagane dane konfiguracji</small></div><button class="fc-quiet-link" data-route="zus">Otwórz ${icon('chevron')}</button></article></div></section>
 <section class="fc-card">${novCalendar()}<div class="fc-card-head"><div><h2>Oś rozliczenia</h2><p>Stan danych, nie stan urzędu</p></div></div><ol class="fc-steps"><li class="done"><span>1</span><div><strong>Zarejestrowane dokumenty</strong><p>Wprowadzone, do weryfikacji</p></div></li><li class="active"><span>2</span><div><strong>Weryfikacja podatkowa</strong><p>Wymaga sprawdzenia przez użytkownika</p></div></li><li><span>3</span><div><strong>Potwierdzenie rozliczenia</strong><p>Brak zatwierdzonej deklaracji</p></div></li><li><span>4</span><div><strong>Opłacenie</strong><p>Brak informacji o płatności</p></div></li></ol><button class="fc-btn secondary" data-route="vat">${icon('doc')} Otwórz źródła obliczeń</button></section></div></div>`;
}
function renderReport(){
 const [prevYear,prevMonth]=monthBounds(viewYear,viewMonth,-1);
 const periods=[{y:prevYear,m:prevMonth},{y:viewYear,m:viewMonth}];
 $('moduleApp').innerHTML=`<div class="fc-content">${head('','Raporty','',periodBadge())}${info()}<section class="fc-card"><div class="fc-card-head"><div><h2>Porównanie okresów</h2><p>Kwoty netto · PLN</p></div></div>${scenario()==='error'?errorPanel():scenario()==='empty'?emptyPanel():`<div class="fc-table-wrap"><table class="fc-table fc-report-table"><thead><tr><th>Miesiąc</th><th class="fc-right">Przychody netto</th><th class="fc-right">Koszty netto</th><th class="fc-right">Różnica</th></tr></thead><tbody>${periods.map(({y,m})=>{let inc=total(rows('sale',m,y)),exp=total(rows('purchase',m,y));return `<tr><td>${monthName(m,y)}</td><td class="fc-num">${mon(inc)}</td><td class="fc-num">${mon(exp)}</td><td class="fc-num">${mon(inc-exp)}</td></tr>`}).join('')}</tbody></table></div>`}<div class="fc-table-footer">Różnica przychodów i kosztów nie stanowi wyniku podatkowego.</div></section></div>`;
}
function renderSettings(){
 const opt=(v,label,current)=>`<option value="${v}" ${current===v?'selected':''}>${label}</option>`;
 $('moduleApp').innerHTML=`<div class="fc-content">${head('','Ustawienia firmy','')}${info()}
 <div class="fc-columns clarity-settings-layout"><section class="fc-card"><div class="fc-card-head"><div><h2>Dane organizacji</h2><p>Konfiguracja danych firmy</p></div></div>
 <form id="companyForm" novalidate>
 <div class="fc-field"><label for="companyName">Nazwa firmy</label><input id="companyName" value="${safe(formName)}" required aria-invalid="${showSettingError&&!formName.trim()}" ${showSettingError&&!formName.trim()?'aria-describedby="nameError"':''}>${showSettingError&&!formName.trim()?'<small id="nameError" class="fc-form-error">Wpisz nazwę firmy.</small>':''}</div>
 <div class="fc-field"><label for="companyNip">NIP</label><input id="companyNip" inputmode="numeric" maxlength="10" value="${safe(formNip)}" placeholder="10 cyfr" aria-invalid="${showSettingError&&!/^\d{10}$/.test(formNip)}" ${showSettingError&&!/^\d{10}$/.test(formNip)?'aria-describedby="nipError"':''}>${showSettingError&&!/^\d{10}$/.test(formNip)?'<small id="nipError" class="fc-form-error">Podaj NIP składający się z 10 cyfr.</small>':''}</div>
 <div class="fc-field"><label for="taxScheme">Forma rozliczenia podatku dochodowego</label><select id="taxScheme" aria-invalid="${showSettingError&&taxScheme==='unknown'}">${opt('unknown','Wybierz formę',taxScheme)}${opt('cit','CIT — zakres do potwierdzenia',taxScheme)}${opt('other','Inna / wymaga konsultacji',taxScheme)}</select>${showSettingError&&taxScheme==='unknown'?'<small class="fc-form-error">Wybierz formę rozliczenia.</small>':''}</div>
 <div class="fc-field"><label for="vatSetting">Status VAT</label><select id="vatSetting" aria-invalid="${showSettingError&&vatSetting==='unknown'}">${opt('unknown','Wybierz status',vatSetting)}${opt('active','Podatnik VAT czynny',vatSetting)}${opt('exempt','Zwolnienie z VAT — do weryfikacji',vatSetting)}</select>${showSettingError&&vatSetting==='unknown'?'<small class="fc-form-error">Wybierz status VAT.</small>':''}</div>
 <p class="fc-form-help">Zmiany profilu nie stanowią urzędowego potwierdzenia danych.</p>
 <button class="fc-btn primary" type="submit">${icon('check')} Zapisz ustawienia</button>
 </form></section>
 <section class="fc-card"><div class="fc-card-head"><div><h2>Gotowość danych</h2><p>Stan profilu i połączeń</p></div></div><div class="fc-setting-row"><span>Profil podatkowy</span>${status(profileConfigured?'Uzupełniony':'Wymaga uzupełnienia',profileConfigured?'good':'warn')}</div><div class="fc-setting-row"><span>KSeF</span>${status('Niepołączono','neutral')}</div><div class="fc-setting-row"><span>Bank</span>${status('Niepołączono','neutral')}</div><p class="fc-form-help">Przed realnym rozliczeniem potrzebna jest weryfikacja konfiguracji i danych źródłowych.</p><button class="fc-btn secondary" data-route="taxes">Zobacz rozliczenia ${icon('chevron')}</button></section></div></div>`;
}
function renderModule(){
 if(['income','expenses','invoices','documents'].includes(page)){renderTransactions();return}
 if(page==='taxes'){renderTaxes();return}
 if(page==='reports'){renderReport();return}
 if(page==='settings'){renderSettings();return}
 const r=routes.find(x=>x.id===page)||routes[0];let content='';
 if(page==='zus')content=`<div class="fc-card"><h2>Konfiguracja składek ZUS</h2><p class="fc-muted">Dla prawidłowych obliczeń potrzebne są: forma działalności, ulgi, ubezpieczenia i okres rozliczenia.</p>${status('Brak danych firmy','warn')}<div class="fc-mini-actions"><button class="fc-btn primary" data-route="settings">${icon('settings')} Uzupełnij dane firmy</button></div></div>`;
 else if(page==='ksef')content=`<div class="fc-card"><h2>Połączenie KSeF</h2><p class="fc-muted">Brak połączenia z KSeF. Status dokumentu będzie dostępny po aktywowaniu integracji.</p>${status('Niepołączono','neutral')}<div class="fc-steps fc-ksef-steps"><div>1. Faktura</div><div>2. Weryfikacja</div><div>3. Wysyłka</div><div>4. Potwierdzenie serwera</div></div><button class="fc-btn secondary" data-route="vat">Sprawdź rejestr ${icon('chevron')}</button></div>`;
 else content=`<div class="fc-card"><h2>Zakres tego obszaru</h2><p class="fc-muted">Moduł nie jest aktywny dla tej firmy.</p><div class="fc-module-tags">${(sections[page]||['Dokumenty','Kontrola','Podsumowanie']).map(x=>`<span>${x}</span>`).join('')}</div><button class="fc-btn secondary" data-route="vat">Zobacz działający rejestr VAT ${icon('chevron')}</button></div>`;
 $('moduleApp').innerHTML=`<div class="fc-content">${head('',r.label,'')}${info()}${content}</div>`;
}
function showRoute(to,updateHash=true){if(!routes.find(r=>r.id===to))to='home'; periodOpen=false; page=to;document.body.dataset.printRoute=page; selected.clear(); search='';filter='all';expanded=null;detailTax=null;navOpen=false;activePopover='';$('productScreen').classList.remove('side-open');document.querySelector('.burger')?.setAttribute('aria-expanded','false');$('shellPopover').innerHTML='';$('homeApp').hidden=page!=='home';$('moduleApp').hidden=page==='home'||page==='vat';$('app').hidden=page!=='vat';if(page==='home')renderDashboard();else if(page!=='vat')renderModule();refreshNav();if(updateHash&&location.hash!=='#'+page)location.hash=page;document.querySelector('.screen')?.scrollIntoView({behavior:'instant',block:'start'});}
function renderCurrent(){if(page==='home')renderDashboard();else if(page!=='vat')renderModule()}
function popover(which){activePopover=activePopover===which?'':which;let content='';if(activePopover==='notifications')content=profileConfigured?'<h3>Powiadomienia</h3><p>Brak nowych powiadomień.</p>':'<h3>Do sprawdzenia</h3><p>Uzupełnij ustawienia firmy przed przygotowaniem rozliczeń.</p><button data-route="settings">Uzupełnij dane</button>';if(activePopover==='account')content='<h3>Anna Kowalska</h3><p>Administrator · Studio Północ</p><button data-route="settings">Ustawienia firmy</button>'; $('shellPopover').innerHTML=activePopover?`<div class="shell-menu" role="dialog" aria-label="${activePopover}">${content}</div>`:'';}
function fcToast(t){$('toastRoot').innerHTML=`<div class="toast" role="status">${safe(t)}</div>`;clearTimeout(fcToast.id);fcToast.id=setTimeout(()=>$('toastRoot').innerHTML='',3000)}
function download(){let arr=transRows(),cols=['date','contractor','number','type','net','vat','gross'];let out='\ufeff'+['Data','Kontrahent','Dokument','Typ','Netto (PLN)','VAT (PLN)','Brutto (PLN)'].join(';')+'\r\n'+arr.map(r=>cols.map(k=>'"'+String(r[k]).replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='onsaldo-dokumenty.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);fcToast('Wyeksportowano dokumenty.');}
function bulkConfirm(){if(!selected.size)return;const root=$('overlayRoot');root.innerHTML=`<div class="overlay" data-fc="modal-close"><section class="modal fc-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="bulkTitle"><h2 id="bulkTitle">Potwierdź zmianę oznaczenia</h2><p>Zostanie oznaczonych ${selected.size} dokumentów jako „Do weryfikacji”. Zmiana dotyczy zaznaczonych dokumentów.</p><div class="modal-actions"><button class="fc-btn secondary" data-fc="modal-close">Anuluj</button><button class="fc-btn primary" data-fc="bulk-accept">Potwierdź</button></div></section></div>`;OnsaldoDialog.activate({onDismiss:()=>OnsaldoDialog.close(),returnTo:'[data-fc="bulk"]',focusTo:'[data-fc="modal-close"]'});}
// delegated controls: each action is functional and keyboard accessible.
document.addEventListener('click',e=>{
 const vatMonth=e.target.closest('[data-action="set-month"]');if(vatMonth){viewYear=Number(D.state.year);viewMonth=Number(vatMonth.dataset.month);pickerYear=viewYear;periodOpen=false}
 let p=e.target.closest('[data-period]');
 if(p){
  let a=p.dataset.period;
  if(a==='open'){periodOpen=!periodOpen;pickerYear=viewYear;renderCurrent();return}
  if(a==='prev'||a==='next'){const [y,m]=monthBounds(viewYear,viewMonth,a==='prev'?-1:1);selectPeriod(y,m);return}
  if(a==='year-prev'||a==='year-next'){pickerYear+=(a==='year-prev'?-1:1);renderCurrent();return}
  if(a==='month'){selectPeriod(pickerYear,Number(p.dataset.month));return}
 }
 const day=e.target.closest('[data-calendar-day]');if(day){selectedDay=Number(day.dataset.calendarDay);renderCurrent();return}
 if(periodOpen&&!e.target.closest('.period-controller')){periodOpen=false;renderCurrent()}
 let r=e.target.closest('[data-route]');if(r){showRoute(r.dataset.route);return}
 let shell=e.target.closest('[data-shell]');if(shell){let a=shell.dataset.shell;if(a==='toggle-nav'){const isOpen=$('productScreen').classList.toggle('side-open');shell.setAttribute('aria-expanded',String(isOpen));shell.setAttribute('aria-label',isOpen?'Zamknij menu nawigacyjne':'Otwórz menu nawigacyjne');return}if(a==='collapse-nav'){const collapsed=$('productScreen').classList.toggle('sidebar-collapsed');shell.setAttribute('aria-expanded',String(!collapsed));return}if(a==='close-nav'){$('productScreen').classList.remove('side-open');document.querySelector('.burger')?.setAttribute('aria-expanded','false');return}if(a==='dismiss-attention'){attentionDismissed=true;try{sessionStorage.setItem('onsaldo-attention-dismissed','1')}catch{};const notice=document.querySelector('.clarity-attention');if(notice){notice.classList.add('is-dismissing');setTimeout(()=>renderCurrent(),145)}else renderCurrent();return}if(a==='more'){showMore=!showMore;refreshNav();return}if(a==='restore'){D.state.scenario='filled';document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('active',b.dataset.scenario==='filled'));D.render();renderCurrent();fcToast('Dane są ponownie dostępne.');return}if(a==='dismiss'){$('shellPopover').innerHTML='';activePopover='';return}popover(a);return}
 let f=e.target.closest('[data-fc]');if(!f){if(activePopover&&!e.target.closest('#shellPopover')){$('shellPopover').innerHTML='';activePopover=''};return}
 let a=f.dataset.fc,id=f.dataset.id;
 if(a==='toggle'){expanded=expanded===id?null:id;renderCurrent();return}
 if(a==='tax-detail'){detailTax=detailTax==='vat'?null:'vat';renderCurrent();return}
 if(a==='export'){download();return}
 if(a==='bulk'){bulkConfirm();return}
 if(a==='unselect'){selected.clear();renderCurrent();return}
 if(a==='modal-close'){if(e.target===f||f.tagName==='BUTTON')OnsaldoDialog.close();return}
 if(a==='bulk-accept'){selected.forEach(id=>verificationMarked.add(id));const n=selected.size;selected.clear();OnsaldoDialog.close({after:()=>{renderCurrent();fcToast('Oznaczono '+n+' dokumentów do weryfikacji.')}});return}
 });
document.addEventListener('click',e=>{let s=e.target.closest('[data-fc-sort]');if(!s)return;let k=s.dataset.fcSort;sortDir=sortBy===k?-sortDir:-1;sortBy=k;renderCurrent()});
document.addEventListener('change',e=>{let t=e.target;if(['filterYear','filterMonth','periodYear'].includes(t.id)){viewYear=Number(D.state.year)||viewYear;viewMonth=Number(D.state.month)||viewMonth;pickerYear=viewYear;renderCurrent();return}if(t.id==='taxScheme'){taxScheme=t.value;return}if(t.id==='vatSetting'){vatSetting=t.value;return}if(t.id==='transFilter'){filter=t.value;selected.clear();renderCurrent();return}if(t.dataset.fc==='select'){t.checked?selected.add(t.dataset.id):selected.delete(t.dataset.id);renderCurrent();return}if(t.dataset.fc==='select-all'){let arr=transRows();if(t.checked)arr.forEach(r=>selected.add(r.id));else arr.forEach(r=>selected.delete(r.id));renderCurrent();return}});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='transSearch'){let pos=el.selectionStart;search=el.value;selected.clear();renderCurrent();let x=$('transSearch');if(x){x.focus();x.setSelectionRange(pos,pos)}return}if(el.id==='companyName')formName=el.value;if(el.id==='companyNip')formNip=el.value;});
document.addEventListener('submit',e=>{if(e.target.id!=='companyForm')return;e.preventDefault();showSettingError=!(formName.trim()&&/^\d{10}$/.test(formNip)&&taxScheme!=='unknown'&&vatSetting!=='unknown');profileConfigured=!showSettingError;
 if(!showSettingError){try{localStorage.setItem('onsaldo-profile-v5',JSON.stringify({name:formName,nip:formNip,scheme:taxScheme,vat:vatSetting,configured:true}))}catch{} }
 renderSettings();refreshNav();if(!showSettingError)fcToast('Zapisano ustawienia firmy.');});
$('scenarioButtons').addEventListener('click',()=>{selected.clear();renderCurrent()});
window.addEventListener('hashchange',()=>showRoute(location.hash.slice(1)||'home',false));
window.addEventListener('beforeprint',()=>{document.body.dataset.printRoute=page});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){periodOpen=false;renderCurrent()}if(e.key==='Escape'){$('productScreen').classList.remove('side-open');document.querySelector('.burger')?.setAttribute('aria-expanded','false');$('shellPopover').innerHTML='';$('overlayRoot').innerHTML='';activePopover=''}});
const tabletNav=window.matchMedia('(min-width:701px) and (max-width:1160px)');
function adaptNav(){const screen=$('productScreen');if(tabletNav.matches)screen.classList.add('sidebar-collapsed');else if(window.innerWidth>1160)screen.classList.remove('sidebar-collapsed');document.querySelector('[data-shell="collapse-nav"]')?.setAttribute('aria-expanded',String(!screen.classList.contains('sidebar-collapsed')))}
tabletNav.addEventListener?.('change',adaptNav); adaptNav();
showRoute(location.hash.slice(1)||'home',false);
})();

</script>
</body>
</html>
